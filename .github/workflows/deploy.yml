name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/configure-pages@v5
      - name: Build each year
        env:
          JEKYLL_ENV: production
        run: |
          mkdir -p _site
          cp index.html _site/
          for dir in 20[0-9][0-9]/; do
            year="${dir%/}"
            echo "Building $year"
            (cd "$year" && bundle install && bundle exec jekyll build --baseurl "/$year" -d "../_site/$year")
          done
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4